  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes"><span style="width: 0%"></span></div>
  </div>
  <script>
    var unsafeWindow = window;
  </script>

  <script src="main.js" charset="utf-8"></script>
  <script src="cocos2d-js-min.a5841.js" charset="utf-8"></script>
  <script type="text/javascript">
    (function () {
      var splash = document.getElementById("splash");
      if (splash) splash.style.display = "none";
      try {
        if (window.AndroidBinBridge && AndroidBinBridge.hasBin && AndroidBinBridge.hasBin()) {
          var loginPatch =
            AndroidBinBridge.getLoginInjectScript && AndroidBinBridge.getLoginInjectScript();
          if (loginPatch) (0, eval)(loginPatch);
        }
      } catch (e) {
        console.error("[YunQi Native Login] inject failed", e);
      }
      if (typeof window.boot === "function") {
        window.boot();
      } else {
        console.error("[YunQi] main.js 未加载，window.boot 不可用（核心脚本 inline 失败或未就绪）");
      }
    })();
  </script>
