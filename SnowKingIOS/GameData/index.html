<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="no-referrer" />
  <title>SnowKing</title>
  <meta name="viewport"
    content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="renderer" content="webkit" />
  <meta name="force-rendering" content="webkit" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="msapplication-tap-highlight" content="no" />
  <meta name="full-screen" content="yes" />
  <meta name="x5-fullscreen" content="true" />
  <meta name="360-fullscreen" content="true" />
  <meta name="screen-orientation" content="portrait" />
  <meta name="x5-orientation" content="portrait" />
  <meta name="x5-page-mode" content="app" />
  <link rel="stylesheet" type="text/css" href="style-mobile.1777a.css" />
  <link rel="preload" href="cocos2d-js-min.a5841.js" as="script" />
</head>
<body>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes"><span style="width: 0%"></span></div>
  </div>
  <script>
    var unsafeWindow = window;
    window.__isIOSWKWebView = !!(
      window.webkit &&
      window.webkit.messageHandlers
    );
  </script>
  <script src="bin-login.js" charset="utf-8"></script>
  <script src="patch.js" charset="utf-8"></script>
  <script src="src/settings.js" charset="utf-8"></script>
  <script src="game-defines.js" charset="utf-8"></script>
  <script src="main.js" charset="utf-8"></script>
  <script src="cocos2d-js-min.a5841.js" charset="utf-8"></script>
  <script type="text/javascript">
    (function () {
      window.HtmlIsLoaded = true;
      var splash = document.getElementById("splash");
      if (splash) splash.style.display = "none";

      function bootGame() {
        if (window.__snowKingBooted) return;
        if (typeof window.boot === "function") {
          window.__snowKingBooted = true;
          window.__pendingBoot = false;
          window.boot();
        } else {
          console.error("[SnowKing] window.boot is not available.");
        }
      }

      var loginLayerReady =
        window.__binLoginReady ||
        window.__yunqiNativeLoginPatchInstalled ||
        window.__qvqNativeLoginPatchInstalled;

      if (loginLayerReady) {
        bootGame();
      } else {
        window.__pendingBoot = true;
        setTimeout(function () {
          if (window.__pendingBoot) bootGame();
        }, 800);
      }
    })();
  </script>
</body>
</html>
