name: Build SnowKing iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build .app (Debug, no signing)
        run: |
          cd SnowKingIOS.xcodeproj/..
          xcodebuild \
            -project SnowKingIOS.xcodeproj \
            -scheme SnowKing \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.snowking.snowking" \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Package IPA
        run: |
          APP_NAME="SnowKing"
          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/${APP_NAME}.app"
          mkdir -p Payload
          cp -R "${APP_PATH}" Payload/
          zip -r "${APP_NAME}.ipa" Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SnowKing-iOS
          path: "SnowKing.ipa"
          if-no-files-found: error
